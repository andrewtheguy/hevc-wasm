# The page's HEVC decoder: the `hevc` crate behind the few calls remotex's decode
# worker makes, built to WebAssembly with threads and SIMD.
#
# Built by ../../build-rust.sh with wasm-pack, into pkg/. Not a member of the
# workspace above, which names it in `exclude`: it builds for
# `wasm32-unknown-unknown` alone, with the profile, the lockfile and the toolchain
# here. The toolchain is a nightly (rust-toolchain.toml), for the threads the
# module decodes on (.cargo/config.toml).
[package]
name = "hevc-web"
version = "0.0.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hevc = { path = "../hevc", features = ["threads"] }
rayon = "1"
wasm-bindgen = "0.2"

# For speed, not size: this decodes a desktop's every picture.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd", "--enable-threads"]

# For `perf` under Node (`node --perf-basic-prof`): the same optimisation with
# the function names kept, through `wasm-pack build --profiling`.
[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ["-O3", "-g", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd", "--enable-threads"]
