# The module's threads need the standard library built for shared memory, which
# only a nightly Cargo does (`build-std`, in .cargo/config.toml); the shipped
# one links, but its locks are single-thread stubs. The pin is this crate's
# alone, and to a date, so a build is the same compiler until the date is moved:
# the decoder itself builds on stable.
[toolchain]
channel = "nightly-2026-10-31"
components = ["rust-src"]
profile = "minimal"
