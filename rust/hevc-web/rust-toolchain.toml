# The module's threads need the standard library built for shared memory, which
# only a nightly Cargo does (`build-std`, in .cargo/config.toml). The pin is this
# crate's alone; the decoder itself builds on stable. The same dated nightly as
# remotex's wasm modules use, since how the compiler takes `atomics` is changing.
[toolchain]
channel = "nightly-2026-09-29"
components = ["rust-src"]
profile = "minimal"
